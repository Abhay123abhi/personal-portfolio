<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Abhay Jaiswal — Java backend engineer building secure APIs, event-driven microservices, and production-ready platforms." />
    <meta name="theme-color" content="#070b0b" />
    <script>
      (() => {
        let savedTheme;
        try { savedTheme = localStorage.getItem("portfolio-theme"); } catch { savedTheme = null; }
        const theme = savedTheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#070b0b" : "#f5f7f2");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Abhay Jaiswal | Java Backend Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
