name: Portfolio CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '*.config.*'
      - 'netlify.toml'
      - '.nvmrc'
      - '.github/workflows/portfolio-review-qa.yml'
  push:
    branches: [main]
  workflow_dispatch:

# PR updates cancel outdated runs; main builds stay independent of PRs.
concurrency:
  group: portfolio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Code quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Lint JavaScript and React
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Detect unused code and dependencies
        run: npm run check:unused
      - name: Audit dependencies (high and critical advisories)
        run: npm audit --audit-level=high
      - name: Build deployable site and blog pages
        run: npm run build

  browser-qa:
    name: Responsive and functional browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install and build preview
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Test real layout, navigation, blog and metadata
        run: node scripts/check-site.mjs
      # Screenshots are evidence for reviewers, not an old-design pixel threshold.
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-screenshots
          path: test-results/responsive/
          if-no-files-found: ignore
          retention-days: 14
