name: Portfolio review QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '*.config.*'
      - '.nvmrc'
      - '.github/workflows/portfolio-review-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit resolved dependency lockfile to review branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: sync dependency lockfile after upgrades'
            git push origin HEAD:${{ github.head_ref }}
          fi
  quality-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run check:unused
      - run: npm audit --audit-level=high
      - run: npm run build
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start candidate preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Responsive browser and metadata checks
        run: node scripts/check-site.mjs
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Build main baseline
        run: |
          git worktree add /tmp/portfolio-baseline "${{ github.event.pull_request.base.sha }}"
          cd /tmp/portfolio-baseline
          npm ci
          npm run build
      - name: Start both preview servers
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-candidate.log 2>&1 &
          (cd /tmp/portfolio-baseline && npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/portfolio-baseline.log 2>&1) &
          for port in 4173 4174; do
            for i in $(seq 1 50); do
              if curl -fsS http://127.0.0.1:$port/ >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:$port/ >/dev/null
          done
      - name: Compare screenshots
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-comparison
          path: test-results/visual
          if-no-files-found: ignore
